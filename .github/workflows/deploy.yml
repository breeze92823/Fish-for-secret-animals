name: Deploy to Bloxity

# Builds the frontend ONCE and uploads it to Bloxity Hosting (https://hosting.bloxity.io/docs).
# main -> prod channel (https://<gameId>.play.bloxity.io), dev -> dev channel.
# Needs LEGION_GAME_ID (variable or secret) and LEGION_DEPLOY_TOKEN (secret). Staging is opt-in
# (docs.bloxity.io "Environments"): add LEGION_DEPLOY_TOKEN_STAGE (the token from
# hosting.stage.bloxity.io) and every push ships the same build to stage as a separate job, so a
# stage failure never touches prod. No Bloxity host is written in the build: the page is told its
# environment at runtime (src/boxityEnv.js); only this upload step needs the target's API URL.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target:
        description: Platform to deploy this branch to
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - id: t
        env:
          HAS_STAGE_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN_STAGE != '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo 'list=["${{ inputs.target }}"]' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_STAGE_TOKEN" != "true" ]; then echo 'list=["prod"]' >> "$GITHUB_OUTPUT"
          else echo 'list=["prod","staging"]' >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # staging can never take prod down with it
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    env:
      BLOXITY_API_URL: ${{ matrix.target == 'staging' && 'https://api.stage.bloxity.io' || 'https://api.bloxity.io' }}
      DEPLOY_TOKEN: ${{ secrets[matrix.target == 'staging' && 'LEGION_DEPLOY_TOKEN_STAGE' || 'LEGION_DEPLOY_TOKEN'] }}
      GAME_ID: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy config
        run: |
          if [ -z "${GAME_ID}" ]; then
            echo "::error::LEGION_GAME_ID is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::The ${{ matrix.target }} deploy token is not set (LEGION_DEPLOY_TOKEN for prod, LEGION_DEPLOY_TOKEN_STAGE for staging: Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Build
        # VITE_DEV_MODE is deliberately unset so deployed builds use the real Bloxity SDK/CDN.
        # No server URL: built games always reach Fish-for-secret-animals-backend through the
        # Bloxity matchmaker (Legion.SDK.net.resolveEndpoint in src/bloxity.js).
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - name: Upload to Bloxity (${{ matrix.target }})
        run: |
          curl -sS -f -X POST \
            "${BLOXITY_API_URL}/v1/hosting/games/${GAME_ID}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
